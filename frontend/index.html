    <link rel="preconnect" href="https://fonts.googleapis.com">

<body onload="onload()">
<header>GTA Location Mapper</header>
<div class="content" id= "main">
    <div id="map"></div>
	<button id="fillInBtn" class="btn"><i class="fa fa-plus"></i> New POI</button>
	<div id="fillInFormDiv" title="New POI">
		<p>Please fill in the form .</p>
		<form onsubmit="formSubmit(); return false;" id="fillInForm" method="post">
			<fieldset>
				<label for="un" class="ui-hidden-accessible">POI Name:</label>
				<input type="text" name="poiName" id="poiName" value="" placeholder="poiName" autocomplete="off" data-theme="a"/>
				<input type="submit" value="Upload"/>
			</fieldset>
		</form>
	</div>
</div>

<footer>
