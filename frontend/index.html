<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="description" content="Safe Steps – Sicherheitsgefühl im öffentlichen Raum erfassen">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>GTA project G1: Safe Steps</title>

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
          integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
          crossorigin=""/>

    <!-- Schriften -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">

    <!-- Icons (Font Awesome) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">

    <!-- Eigenes CSS -->
    <link rel="stylesheet" href="css/style.css">

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
            integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
            crossorigin="anonymous"></script>
    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
            integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
            crossorigin="" defer></script>
    <!-- Eigenes JS -->
    <script src="js/app.js" defer></script>
</head>
<body onload="onload()">

<div class="content" id="main">
    <div id="map"></div>

    <!-- Fehlermeldungen (z. B. Standort nicht verfügbar) -->
    <div id="error-messages" class="error-messages"></div>

    <button id="fillInBtn" class="flag-btn" aria-label="Neue Meldung erfassen">
        <i class="fa-solid fa-flag"></i>
    </button>
</div>

<!-- ---------- Panel «Anzeigeoptionen» (schiebt sich von unten hoch) ---------- -->
<div id="optionsSheet" class="sheet">
    <button type="button" id="sheetHandle" class="sheet-header"
            aria-expanded="false" aria-controls="sheetBody">
        <span class="sheet-grip"></span>
        <span class="sheet-title">Anzeigeoptionen</span>
    </button>

    <div id="sheetBody" class="sheet-body">
        <label class="toggle-row">
            <span>Vergangene Meldungen</span>
            <input type="checkbox" id="toggleReports" class="toggle" checked>
        </label>
        <label class="toggle-row">
            <span>Standort anzeigen</span>
            <input type="checkbox" id="toggleLocation" class="toggle" checked>
        </label>
    </div>
</div>

<!-- ---------- Fenster «Meldung erfassen» ---------- -->
<div id="poiModal" class="modal hidden">
    <div class="modal-box">

        <div class="modal-top">
            <i class="fa-solid fa-flag modal-flag"></i>
            <button type="button" id="closeModalBtn" class="close-btn" aria-label="Schliessen">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>

        <h2 class="modal-title">Meldung erfassen</h2>

        <form id="fillInForm">
            <!-- Sicherheitsgefühl -->
            <div class="form-section">
                <label for="safety" class="form-label">Sicherheitsgefühl:</label>
                <select id="safety" name="safety" class="form-field">
                    <option value="1">1 - sehr unsicher</option>
                    <option value="2">2 - unsicher</option>
                    <option value="3">3 - neutral</option>
                    <option value="4">4 - sicher</option>
                    <option value="5">5 - sehr sicher</option>
                </select>
            </div>

            <!-- Kategorien -->
            <div class="form-section">
                <span class="form-label">Kategorien:</span>
                <label class="check-row">
                    <input type="checkbox" name="category" value="Schlechte Beleuchtung">
                    <span>Schlechte Beleuchtung</span>
                </label>
                <label class="check-row">
                    <input type="checkbox" name="category" value="Belästigung">
                    <span>Belästigung</span>
                </label>
                <label class="check-row">
                    <input type="checkbox" name="category" value="Unberechenbares Verhalten">
                    <span>Unberechenbares Verhalten</span>
                </label>
                <label class="check-row">
                    <input type="checkbox" name="category" value="Diebstahl">
                    <span>Diebstahl</span>
                </label>
                <label class="check-row">
                    <input type="checkbox" name="category" value="anderes">
                    <span>anderes</span>
                </label>
            </div>

            <!-- Bemerkungen -->
            <div class="form-section last">
                <label for="remark" class="form-label">Bemerkungen:</label>
                <input type="text" id="remark" name="remark" class="form-field"
                       placeholder="z. B. Laterne kaputt..." autocomplete="off">
            </div>

            <button type="submit" class="btn-send">Absenden</button>
        </form>
    </div>
</div>

</body>
</html>
